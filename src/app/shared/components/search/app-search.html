<label class="block w-full max-w-md">
  <span class="sr-only">Buscar categorías</span>
  <input
    class="w-full rounded-lg border border-neutral-300 bg-white px-[var(--spacing-md)] py-[var(--spacing-sm)] text-[var(--color-neutral-800)] placeholder:text-[var(--color-neutral-400)] focus:border-[var(--color-primary-500)] focus:outline-2 focus:outline-offset-2 focus:outline-[var(--color-primary-500)]"
    type="search"
    [value]="query()"
    [placeholder]="placeholder()"
    (input)="onQueryChange($event)"
  />
</label>
