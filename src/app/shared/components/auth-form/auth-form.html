<form
  #authForm
  class="auth-form"
  [attr.aria-label]="title()"
  [attr.aria-busy]="disabled()"
  (submit)="onSubmit($event, authForm)"
>
  <h1 class="auth-form__title">{{ title() }}</h1>

  <div class="auth-form__fields">
    @for (field of fields(); track field.name) {
      <label class="auth-form__field">
        <span>{{ field.label }}</span>
        <input
          [type]="field.type"
          [name]="field.name"
          [attr.placeholder]="field.placeholder ?? null"
          [attr.autocomplete]="field.autocomplete ?? null"
          [required]="field.required ?? false"
          [disabled]="disabled()"
        />
      </label>
    }
  </div>

  <app-button [label]="submitLabel()" type="submit" [fullWidth]="true" [disabled]="disabled()" />
</form>
