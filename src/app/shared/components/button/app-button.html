<span class="inline-block" [class.w-full]="fullWidth()">
  <button
    class="inline-flex min-h-12 items-center justify-center rounded-lg border px-(--spacing-md) py-(--spacing-xs) [font:inherit] text-center font-semibold cursor-pointer transition-[background-color,border-color,color,box-shadow] duration-150 ease-[ease] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--color-primary-900) enabled:active:translate-y-px disabled:cursor-not-allowed disabled:opacity-[0.55] motion-reduce:transition-none"
    [ngClass]="{
      'border-transparent bg-(--button-background,var(--color-primary-500)) text-(--button-color,white) enabled:hover:bg-(--button-hover-background,var(--color-primary-700))':
        variant() === 'primary',
      'border-transparent bg-(--button-background,var(--color-secondary-500)) text-(--button-color,white) enabled:hover:bg-(--button-hover-background,var(--color-secondary-600))':
        variant() === 'secondary',
      'border-transparent bg-green-600 text-(--button-color,white) enabled:hover:bg-(--button-hover-background,var(--color-secondary-700))':
        variant() === 'green',
      'border-transparent bg-red-500 text-(--button-color,white) enabled:hover:bg-(--button-hover-background,)':
        variant() === 'red',
      'border-transparent bg-yellow-500 text-(--button-color,white) enabled:hover:bg-(--button-hover-background,var(--color-secondary-500))':
        variant() === 'yellow',
      'border-(--button-border-color,var(--color-primary-500)) bg-transparent text-(--button-color,var(--color-primary-700)) enabled:hover:bg-(--button-hover-background,var(--color-primary-50))':
        variant() === 'transparent',
      'w-full': fullWidth(),
    }"
    [type]="type() === 'file' ? 'button' : type()"
    [disabled]="disabled()"
    (click)="onButtonClick($event, fileInput)"
  >
    {{ label() }}
  </button>
  <input
    #fileInput
    class="hidden"
    type="file"
    [accept]="accept()"
    [disabled]="disabled()"
    (change)="onFileSelected($event)"
  />
</span>
