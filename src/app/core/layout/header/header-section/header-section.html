<header class="header">
  <a class="header__home" routerLink="/">
    <img class="header__logo" src="/favicon_io/android-chrome-192x192.png" alt="Cook and Share" />
  </a>
  @if (authService.isAuthenticated()) {
    <div class="header__user">
      <button
        class="header__user-toggle"
        type="button"
        aria-label="Abrir menú de usuario"
        aria-haspopup="menu"
        [attr.aria-expanded]="userMenuOpen()"
        (click)="toggleUserMenu()"
      >
        <img
          class="header__avatar"
          src="/images/avatar_defaultUrl.png"
          alt=""
          width="44"
          height="44"
        />
      </button>
      @if (userMenuOpen()) {
        <nav class="header__menu" aria-label="Menú de usuario" role="menu">
          <a
            class="header__menu-item"
            routerLink="/user-details"
            role="menuitem"
            (click)="closeUserMenu()"
          >
            Detalles de cuenta
          </a>
          <button class="header__menu-item" type="button" role="menuitem" (click)="logout()">
            Desconectarse
          </button>
        </nav>
      }
    </div>
  } @else {
    <a class="header__login" routerLink="/login">Iniciar sesión</a>
  }
</header>
